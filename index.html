<!DOCTYPE html>
<html>
<head>
  <title>Addition App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    input {
      padding: 8px;
      margin: 5px;
      width: 100px;
    }
    button {
      padding: 10px 20px;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Simple Addition Calculator</h1>

  <input type="number" id="num1" placeholder="Number 1">
  <input type="number" id="num2" placeholder="Number 2">

  <br><br>

  <button onclick="addNumbers()">Add</button>

  <div id="result"></div>

  <script>
    function addNumbers() {
      const n1 = parseFloat(document.getElementById("num1").value) || 0;
      const n2 = parseFloat(document.getElementById("num2").value) || 0;
      const sum = n1 * n2;

      document.getElementById("result").innerText = "Result: " + sum;
    }
  </script>

</body>
</html>
